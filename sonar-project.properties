sonar.projectKey=jtn0123_frigate
sonar.organization=jtn0123ismysonar
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11

# Keep repository-wide analysis, including docs and developer tools.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=frigate/test/**,**/*.test.*,**/*.spec.*,web/__test__/**,web/e2e/**,fork/**/test_*.py,fork/audio_trial/smoke.py,fork/audio_trial/startup_check.py,fork/scripts/audio-recovery-check.py
sonar.exclusions=**/node_modules/**,**/coverage/**,coverage-py/**,**/dist/**,docs/build/**,**/.cache/**,**/playwright-report/**,**/test-results/**,**/*.png,**/*.jpg,**/*.webp,**/*.gif,**/*.ico,**/*.woff2,.github/copilot-instructions.md
# Generated declarations/version metadata have no executable behavior.
sonar.coverage.exclusions=**/*.d.ts,frigate/version.py
sonar.python.coverage.reportPaths=coverage-py/coverage.xml
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
