# Install once with: pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-format
        files: ^(frigate|migrations|docker|fork/scripts|fork/benchmarks|fork/audio_trial|fork/monitoring)/.*\.py$|^[^/]+\.py$
      - id: ruff-check
        args: [--fix]
        files: ^(frigate|migrations|docker|fork/scripts|fork/benchmarks|fork/audio_trial|fork/monitoring)/.*\.py$|^[^/]+\.py$
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
        # Fork-owned workflows; upstream workflows retain their own lint baseline.
        files: ^\.github/workflows/fork-.*\.ya?ml$
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: ^fork/.*\.sh$
  - repo: local
    hooks:
      - id: eslint-web
        name: eslint (web)
        entry: bash -c 'cd web && npx eslint --cache --cache-strategy content --cache-location .cache/eslint/ --fix "${@#web/}"' --
        language: system
        files: ^web/.*\.(ts|tsx|js|jsx)$
        exclude: ^web/(dist|node_modules/)|web/src/types/fork/api\.gen\.ts$
      - id: prettier-web
        name: prettier (web)
        entry: bash -c 'cd web && npx prettier --write "${@#web/}"' --
        language: system
        files: ^web/.*\.(ts|tsx|js|jsx|css|html|json)$
        exclude: ^web/(dist|node_modules|public/locales/)|web/src/types/fork/api\.gen\.ts$
