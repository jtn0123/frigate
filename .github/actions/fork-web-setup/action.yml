name: "Fork web setup"
description: "Node 22 plus web/node_modules restored from cache, or npm ci on a miss"
runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: 22.x
    # node_modules itself is cached (not ~/.npm) so a hit skips npm ci
    # entirely. The key covers everything npm ci depends on: OS, Node major,
    # the lockfile and patch-package's postinstall patches.
    - id: node-modules
      uses: actions/cache@v4
      with:
        path: web/node_modules
        key: web-node-modules-${{ runner.os }}-node22-${{ hashFiles('web/package-lock.json', 'web/patches/**') }}
    # No dependency lifecycle scripts: the ones in the tree (esbuild, @swc/core,
    # msw) only verify or copy files their packages already ship. The app's own
    # postinstall (patch-package) is the one install step that is needed.
    - if: steps.node-modules.outputs.cache-hit != 'true'
      run: |
        npm ci --ignore-scripts
        npm run postinstall
      shell: bash
      working-directory: ./web
