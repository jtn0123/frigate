version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
    # fork: `dev` only mirrors upstream, so PRs there would never reach the
    # workflows that run. Security fixes land on main as one grouped PR;
    # version bumps of the fork's own workflows are part of the majors phase
    # (fork/PLAN2.md PR-28). target-branch unset so this applies to security.
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: daily
    # fork: base images arrive by rebasing onto upstream; no PRs of any kind.
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
  - package-ecosystem: "pip"
    directory: "/docker/main"
    schedule:
      interval: daily
    # fork: no version-update PRs (versions arrive by rebasing onto upstream);
    # security fixes land on main as one grouped PR. target-branch is left
    # unset because it would stop these settings applying to security updates.
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "pip"
    directory: "/docker/tensorrt"
    schedule:
      interval: daily
    # fork: not part of the amd64 image this fork builds; no PRs of any kind.
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
  - package-ecosystem: "pip"
    directory: "/docker/rockchip"
    schedule:
      interval: daily
    # fork: not part of the amd64 image this fork builds; no PRs of any kind.
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
  - package-ecosystem: "pip"
    directory: "/docker/rocm"
    schedule:
      interval: daily
    # fork: not part of the amd64 image this fork builds; no PRs of any kind.
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
  - package-ecosystem: "pip"
    directory: "/fork"
    schedule:
      interval: daily
    # fork: the fork's own dev and scanner pins (requirements-sonar.txt, and
    # requirements-dev.lock through docker/main/requirements-dev.txt, whose
    # drift fork/scripts/dev-lock-check.py fails the test image build on).
    # Same policy as the image: security fixes only, one grouped PR.
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "pip"
    directory: "/fork/audio_trial"
    schedule:
      interval: daily
    # fork: the audio companion's source pins. Dependabot updates
    # requirements.in; fork/scripts/audio-lock-check.py fails CI until
    # requirements.lock is recompiled from it, so a bump cannot land half done.
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: daily
    # fork: no version-update PRs (versions arrive by rebasing onto upstream);
    # security fixes land on main as one grouped PR. target-branch is left
    # unset because it would stop these settings applying to security updates.
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: daily
    # fork: not part of the amd64 image this fork builds; no PRs of any kind.
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
