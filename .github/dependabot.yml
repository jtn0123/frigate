version: 2
updates:
  - package-ecosystem: "github-actions"
    # Local composite actions are only scanned when their directory is listed
    directories:
      - "/"
      - "/.github/actions/setup"
      - "/.github/actions/fork-web-setup"
      - "/.github/actions/fork-benchmark-case"
    schedule:
      interval: daily
    # fork: `dev` only mirrors upstream, so PRs there would never reach the
    # workflows that run. Security fixes land on main as one grouped PR;
    # version bumps of the fork's own workflows are part of the majors phase
    # (fork/PLAN2.md PR-28). target-branch unset so this applies to security.
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: daily
    # fork: base images arrive by rebasing onto upstream; no PRs of any kind.
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
  - package-ecosystem: "pip"
    directory: "/docker/main"
    schedule:
      interval: daily
    # fork: no version-update PRs (versions arrive by rebasing onto upstream);
    # security fixes land on main as one grouped PR. target-branch is left
    # unset because it would stop these settings applying to security updates.
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
    # Upstream's holds (#24624). Ignore rules also apply to security updates,
    # so a security PR never proposes a version known to break the image.
    ignore:
      # numpy 2.5 needs Python 3.12; norfair, tflite_runtime and rknn-toolkit2
      # cap numpy below 2
      - dependency-name: "numpy"
        versions: [">=2"]
      # Every OpenCV wheel from 4.12 requires numpy 2 (fork: the image uses
      # the contrib headless build)
      - dependency-name: "opencv-contrib-python-headless"
        versions: [">=4.12"]
      # aarch64 only. Rockchip rknn-toolkit2 caps protobuf at 4.25.4 and
      # TensorFlow 2.21 needs protobuf 6.31 or newer.
      - dependency-name: "tensorflow"
        versions: [">=2.20"]
      # Needs Python 3.12 and numpy 2
      - dependency-name: "librosa"
        versions: [">=1.0"]
      # pandas 3.1 requires numpy 2
      - dependency-name: "pandas"
        versions: [">=3.1"]
      # Needs Python 3.12
      - dependency-name: "scipy"
        versions: [">=1.18"]
      # Newer stubs report false errors against peewee 4
      - dependency-name: "types-peewee"
        versions: [">=4.1"]
      # sdist only and imported by HailoRT; needs a Hailo device to test
      - dependency-name: "netifaces"
        versions: [">=0.11"]
  - package-ecosystem: "pip"
    directory: "/docker/tensorrt"
    schedule:
      interval: daily
    # fork: not part of the amd64 image this fork builds; no PRs of any kind.
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
  - package-ecosystem: "pip"
    directory: "/docker/rockchip"
    schedule:
      interval: daily
    # fork: not part of the amd64 image this fork builds; no PRs of any kind.
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
  - package-ecosystem: "pip"
    directory: "/docker/rocm"
    schedule:
      interval: daily
    # fork: ROCm is published. Permit security update PRs for this image too.
    # Zero scheduled version PRs preserves the security-only fork policy.
    open-pull-requests-limit: 0
  - package-ecosystem: "pip"
    directory: "/fork"
    schedule:
      interval: daily
    # fork: the fork's own dev and scanner pins (requirements-sonar.txt, and
    # requirements-dev.lock through docker/main/requirements-dev.txt, whose
    # drift fork/scripts/dev-lock-check.py fails the test image build on).
    # Same policy as the image: security fixes only, one grouped PR.
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "pip"
    directory: "/fork/audio_trial"
    schedule:
      interval: daily
    # fork: the audio companion's source pins. Dependabot updates
    # requirements.in; fork/scripts/audio-lock-check.py fails CI until
    # requirements.lock is recompiled from it, so a bump cannot land half done.
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "gradle"
    directory: "/fork/android"
    schedule:
      interval: daily
    # fork: the Android viewer's version catalog (gradle/libs.versions.toml).
    # Same policy as the image: security fixes only, one grouped PR. Gradle
    # checks every download against gradle/verification-metadata.xml, so a
    # security PR fails "Fork - Android" until that file is regenerated for the
    # new versions (fork/android/README.md, Build).
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: daily
    # fork: no version-update PRs (versions arrive by rebasing onto upstream);
    # security fixes land on main as one grouped PR. target-branch is left
    # unset because it would stop these settings applying to security updates.
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
    # Upstream's holds (#24624), kept for the same reason as above.
    ignore:
      # typescript-eslint peers typescript below 6.1
      - dependency-name: "typescript"
        versions: [">=6.1"]
      # Tailwind 4 is a config rewrite; scrollbar 4 and merge 3 depend on it
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwind-scrollbar"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwind-merge"
        update-types: ["version-update:semver-major"]
      # Intermittent failure in the UI settings import spec, cause not found
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      # Every later version clamps the pan when the player hides or drops
      # pinch gestures near the edges, 4.2.0 included
      - dependency-name: "react-zoom-pan-pinch"
        versions: [">3.4.4"]
      # 0.54 pins a vulnerable dompurify; 0.55+ breaks YAML validation until
      # monaco-worker-manager releases its PR 4
      - dependency-name: "monaco-editor"
        versions: [">=0.54.0"]
      # Later versions need Node 22 and extract false keys
      - dependency-name: "i18next-cli"
        versions: [">1.5.11"]
      # 6.11.0 refills the saved model in the GenAI settings form
      - dependency-name: "@rjsf/*"
        versions: ["6.11.0"]
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: daily
    # fork: not part of the amd64 image this fork builds; no PRs of any kind.
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
