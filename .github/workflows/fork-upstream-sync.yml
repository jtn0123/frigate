name: Fork - Upstream sync

# Read-only fetch of blakeblackshear/frigate. Fast-forwards origin/dev.
# Never pushes next, main or tags. A clean rebase of next (where pull requests
# land as merge commits, which the rebase keeps) onto upstream/dev is
# force-pushed to sync/upstream only; conflicts or a failed rebase open or
# update an issue. main follows next through `make promote`.

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: fork-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream/dev
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN may not push commits that change .github/workflows, and
      # upstream's do, so every push here needs FORK_SYNC_TOKEN. Without it the
      # run used to fail at the first push with a raw git error; stop here
      # instead and say what to create. The secret is only tested for
      # emptiness, never printed. Setup steps: fork/README.md, "Owner setup".
      - name: Require the FORK_SYNC_TOKEN secret
        id: token
        env:
          HAS_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN != '' }}
        run: |
          if [ "$HAS_SYNC_TOKEN" = "true" ]; then
            exit 0
          fi
          echo "missing=true" >>"$GITHUB_OUTPUT"
          echo "::error title=FORK_SYNC_TOKEN is not set::Create a fine-grained personal access token for the repository $GITHUB_REPOSITORY with Contents: Read and write and Workflows: Read and write, then save it as the Actions repository secret FORK_SYNC_TOKEN (Settings > Secrets and variables > Actions). Steps: fork/README.md, Owner setup."
          exit 1

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: next
          token: ${{ secrets.FORK_SYNC_TOKEN }}

      - name: Set the bot's git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream (read-only)
        run: |
          git remote add upstream https://github.com/blakeblackshear/frigate.git
          git fetch --no-tags upstream dev
          git fetch --tags --force upstream
          git fetch origin dev:refs/remotes/origin/dev || true
          git fetch origin next:refs/remotes/origin/next

      - name: Fast-forward origin/dev
        run: |
          git checkout -B dev origin/dev
          git merge --ff-only upstream/dev
          git push origin dev

      - name: Rebase next onto upstream/dev or open an issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          UPSTREAM=$(git rev-parse upstream/dev)
          NEXT=$(git rev-parse origin/next)
          if git merge-base --is-ancestor "$UPSTREAM" "$NEXT"; then
            echo "next already contains upstream/dev ($UPSTREAM)"
            exit 0
          fi

          COMMITS=$(git log --oneline "$NEXT..$UPSTREAM")
          N=$(echo "$COMMITS" | grep -c . || true)
          ISSUE_TITLE="Upstream moved ${N} commits"

          git checkout -B sync/upstream origin/next
          # Pull requests land on next as merge commits; keep them as merges
          # rather than flattening each PR onto upstream/dev. Git redoes each
          # merge, so one that needed a hand resolution conflicts again and is
          # reported below instead of being replayed without it.
          REBASE_LOG="$RUNNER_TEMP/rebase.log"
          if git rebase --rebase-merges upstream/dev >"$REBASE_LOG" 2>&1; then
            cat "$REBASE_LOG"
            # A FORK_SYNC_TOKEN push starts Fork - Checks by itself.
            git push --force-with-lease origin sync/upstream
            BODY=$(printf 'upstream/dev moved %s commit(s) that are not in next.\n\n%s\n\nA rebase of next is on sync/upstream, where Fork - Checks runs.\nThis bot never pushes next, main or tags.\n' "$N" "$COMMITS")
            EXISTING=$(gh issue list --search "Upstream moved in:title" --state open --json number,title --jq '.[0].number // empty')
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --title "$ISSUE_TITLE" --body "$BODY"
            else
              gh issue create --title "$ISSUE_TITLE" --body "$BODY"
            fi
          else
            cat "$REBASE_LOG"
            CONFLICTS=$(git diff --name-only --diff-filter=U || true)
            git rebase --abort || true
            if [ -n "$CONFLICTS" ]; then
              BODY=$(printf 'Could not rebase next onto upstream/dev (%s).\n\nConflicted files:\n%s\n\nUpstream commits not in next:\n%s\n' "$UPSTREAM" "$CONFLICTS" "$COMMITS")
            else
              # No file conflicted, so something else failed: report git's error.
              echo "::error title=Rebase failed::git rebase failed without a conflict; see its output above"
              # Indented four spaces, git's output renders as a code block.
              ERROR=$(tail -n 20 "$REBASE_LOG" | sed 's/^/    /')
              BODY=$(printf 'Could not rebase next onto upstream/dev (%s), and no file conflicted. git said:\n\n%s\n\nUpstream commits not in next:\n%s\n' "$UPSTREAM" "$ERROR" "$COMMITS")
            fi
            EXISTING=$(gh issue list --search "Upstream moved in:title" --state open --json number,title --jq '.[0].number // empty')
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --title "$ISSUE_TITLE" --body "$BODY"
            else
              gh issue create --title "$ISSUE_TITLE" --body "$BODY"
            fi
          fi

      - name: Open an issue for new upstream v* tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Only tags that contain the fork base, excluding the base itself, so
          # the first run does not file issues for every historical v*. Move
          # BASE when next is rebased onto a newer upstream release (it matches
          # FORK_TEST_BASE in the Makefile).
          git fetch --tags --force origin || true
          BASE=v0.18.0
          git rev-parse "$BASE" >/dev/null
          git tag -l 'v*' | while read -r TAG; do
            [ "$TAG" = "$BASE" ] && continue
            git merge-base --is-ancestor "$BASE" "$TAG" || continue
            TITLE="Upstream released ${TAG}"
            if gh issue list --search "${TITLE} in:title" --state all --json number --jq '.[0].number // empty' | grep -q .; then
              continue
            fi
            gh issue create --title "$TITLE" --body "Upstream published \`${TAG}\`. This bot does not push branches or tags. Rebase next onto it when ready, then \`make promote\` to build and release it."
          done

      - name: Open an issue when the sync fails
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TOKEN_MISSING: ${{ steps.token.outputs.missing }}
        run: |
          set -euo pipefail
          TITLE="Upstream sync failed"
          EXISTING=$(gh issue list --search "${TITLE} in:title" --state open --json number --jq '.[0].number // empty')
          if [ "$TOKEN_MISSING" = "true" ]; then
            # The cause is known, so the issue body states it. An open issue is
            # rewritten, not commented on: this repeats daily until the owner
            # adds the secret, and one comment a day would bury the steps.
            BODY=$(printf 'The upstream sync cannot run: the Actions repository secret FORK_SYNC_TOKEN does not exist (or is empty). Last run: %s\n\nUpstream commits change .github/workflows, and GitHub refuses a GITHUB_TOKEN push that touches workflow files, so dev stays frozen until the secret exists.\n\nOwner steps:\n1. GitHub > Settings > Developer settings > Personal access tokens > Fine-grained tokens > Generate new token.\n2. Resource owner: the owner of %s. Repository access: Only select repositories, %s.\n3. Repository permissions: Contents: Read and write, Workflows: Read and write. Everything else stays at No access (Metadata: Read-only is added automatically).\n4. Pick an expiry and note it, then copy the token.\n5. In %s: Settings > Secrets and variables > Actions > New repository secret, name FORK_SYNC_TOKEN, value the token.\n6. Actions > Fork - Upstream sync > Run workflow, then close this issue once the run is green.\n\nThe same steps are in fork/README.md under Owner setup.\n' "$RUN_URL" "$GH_REPO" "$GH_REPO" "$GH_REPO")
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --body "$BODY"
            else
              gh issue create --title "$TITLE" --body "$BODY"
            fi
            exit 0
          fi
          BODY=$(printf 'The upstream sync failed: %s\n\nThe FORK_SYNC_TOKEN secret is set, so read the failed step in the run. A rejected push usually means the token expired or lost Contents or Workflows write (GitHub refuses a push that changes .github/workflows without it); rotate it with the steps in fork/README.md under Owner setup.\n' "$RUN_URL")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
