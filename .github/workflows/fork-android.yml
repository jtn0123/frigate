name: Fork - Android

# Builds and checks the Android viewer in fork/android (AN1): formatting,
# detekt, unit tests with coverage and screenshot comparison, Android lint, and
# the debug and minified release builds, all through its scripts/check.sh. It
# runs only when the app or this workflow changes.

on:
  workflow_dispatch:
  push:
    branches:
      - next
      - main
    paths:
      - "fork/android/**"
      - ".github/workflows/fork-android.yml"
  pull_request:
    branches:
      - next
      - main
    paths:
      - "fork/android/**"
      - ".github/workflows/fork-android.yml"

permissions:
  contents: read

concurrency:
  group: fork-android-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Android check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fork/android
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Format, static analysis, test, lint and build (debug and release)
        run: scripts/check.sh
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-app-debug
          path: fork/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      # The test results as a job summary, with failures annotated, pass or fail.
      # annotate_only: no check run, so the job needs no checks: write.
      - name: Test report
        if: always()
        uses: mikepenz/action-junit-report@8a133bfa3ecb0ea9024c1e2ae788b4c25f6cdb9d # v6.6.2
        with:
          report_paths: fork/android/app/build/test-results/**/TEST-*.xml
          annotate_only: true
          detailed_summary: true
      # On failure: the HTML reports, the JUnit XML, and Roborazzi's new screenshots
      # and diffs (*_actual.png, *_compare.png), to see what changed.
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            fork/android/app/build/reports/
            fork/android/app/build/test-results/
            fork/android/app/build/outputs/roborazzi/
          retention-days: 7
