name: Fork - Checks

# Same gates as upstream's pull_request.yml, run on pushes to next (where pull
# requests land) and main (the release branch), with dependency caching and a
# thin backend test image instead of a full devcontainer build. Web and Python
# lint and E2E jobs run only when their files changed. Both coverage suites run
# on every revision so Sonar never mixes reports from different commits.
# "Checks passed" includes the Sonar quality gate for trusted revisions.

on:
  workflow_dispatch:
  push:
    branches:
      - next
      - main
      - "sync/**"
  pull_request:
    branches:
      - next
      - main

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: fork-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_PYTHON: "3.11"
  FORK_TEST_BASE: ghcr.io/blakeblackshear/frigate:0.18.0-rc2

jobs:
  secrets_scan:
    name: Secrets - gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      # dev mirrors upstream, so dev..HEAD is exactly the fork's own commits.
      - run: git fetch --no-tags origin dev:refs/remotes/origin/dev
      - name: Install gitleaks
        run: |
          curl --proto '=https' -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan fork commits
        run: ./gitleaks git --no-banner --redact --log-opts="origin/dev..HEAD" .

  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: fork/scripts/ci-changes.sh

  web_lint:
    name: Web - Lint + typecheck
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/fork-web-setup
      # eslint (content strategy) and tsc (content hashes) both key their
      # caches on file contents, so a cache from an earlier commit is safe.
      - uses: actions/cache@v4
        with:
          path: web/.cache
          key: web-lint-cache-${{ github.sha }}
          restore-keys: web-lint-cache-
      - run: npm run lint
        working-directory: ./web
      - run: npm run typecheck
        working-directory: ./web
      - run: npm run type-ratchet
        working-directory: ./web
      - run: npm run i18n:extract:ci
        working-directory: ./web

  # Tools run straight from node_modules/.bin (the lockfile's versions), not
  # through npx, which could fetch a missing package from the registry.
  web_unit:
    name: Web - Unit tests + production build
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/fork-web-setup
      - run: node_modules/.bin/vitest run --coverage
        working-directory: ./web
      # Typechecking is web_lint's job; this is `npm run build` without tsc.
      - run: node_modules/.bin/vite build --base=/BASE_PATH/
        working-directory: ./web
      - run: npm run bundle:budget
        working-directory: ./web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-coverage
          if-no-files-found: error
          path: web/coverage
          retention-days: 7

  web_build:
    name: Web - E2E build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/fork-web-setup
      # `npm run e2e:build` without tsc; built once and shared by every shard.
      - run: node_modules/.bin/vite build --base=/
        working-directory: ./web
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-dist
          path: web/dist
          retention-days: 1

  web_e2e:
    name: Web - E2E (${{ matrix.shard }}/3)
    needs: web_build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/fork-web-setup
      - uses: actions/download-artifact@v4
        with:
          name: e2e-dist
          path: web/dist
      # Headless runs use only the headless shell, a smaller download than the
      # full browser.
      - run: node_modules/.bin/playwright install chromium --only-shell --with-deps
        working-directory: ./web
      - run: npm run e2e -- --shard=${{ matrix.shard }}/3
        working-directory: ./web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  python_checks:
    name: Python - Lint
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.4.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip
          cache-dependency-path: fork/requirements-dev.lock
      # docker/main/requirements-dev.txt, hash-pinned; the test image build
      # (python_tests) fails if the two disagree.
      - run: |
          python3 -m pip install --require-hashes --only-binary :all: -r fork/requirements-dev.lock
      - run: ruff format --check --diff frigate migrations docker fork/scripts fork/audio_trial ./*.py
      - run: ruff check frigate migrations docker fork/scripts fork/audio_trial ./*.py
      - run: |
          python3 -m pip install --require-hashes --only-binary :all: -r fork/requirements-sonar.txt
      - run: python3 -m unittest discover -s fork/scripts -p "test_*.py"

  python_tests:
    name: Python - mypy, API spec, unittest
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: make version
      - run: docker build -f fork/Dockerfile.test --build-arg BASE="${FORK_TEST_BASE}" -t frigate-fork-test .
      - run: fork/scripts/py-checks.sh
        env:
          COVERAGE_XML: coverage-py/coverage.xml
      - name: Audio companion unit tests
        run: docker run --rm -v "$PWD/fork/audio_trial:/opt/frigate/fork/audio_trial:ro" frigate-fork-test discover -s fork/audio_trial -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage
          if-no-files-found: error
          path: coverage-py/coverage.xml
          retention-days: 7

  sonar:
    name: Sonar - Coverage + quality gate
    needs: [web_unit, python_tests]
    # Fork PRs have no secret. Never use pull_request_target to scan their code.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: web-coverage
          path: web/coverage
      - uses: actions/download-artifact@v4
        with:
          name: python-coverage
          path: coverage-py
      - uses: actions/setup-python@v5.4.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - run: |
          python3 -m pip install --require-hashes --only-binary :all: -r fork/requirements-sonar.txt
      - name: Verify coverage reports
        run: python3 fork/scripts/sonar-coverage-check.py
      - name: Check Sonar authentication
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "::error::Add the SONAR_TOKEN repository secret before enabling CI analysis"
            exit 1
          fi
      - name: Scan and wait for the quality gate
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600

  checks_passed:
    name: Checks passed
    if: always()
    needs:
      [
        secrets_scan,
        changes,
        web_lint,
        web_unit,
        web_build,
        web_e2e,
        python_checks,
        python_tests,
        sonar,
      ]
    runs-on: ubuntu-latest
    steps:
      # Skipped jobs are fine (their files did not change); failed or
      # cancelled ones are not.
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: ${RESULTS}"
          if [[ " ${RESULTS} " == *" failure "* || " ${RESULTS} " == *" cancelled "* ]]; then
            exit 1
          fi
