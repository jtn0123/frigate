name: Fork - Checks

# Same gates as upstream's pull_request.yml, run on every push to main, with
# dependency caching and a thin backend test image instead of a full devcontainer
# build. Web and Python jobs run only when their files changed (docs-only
# commits run just the secrets scan); "Checks passed" is the single job to
# require.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "sync/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: fork-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_PYTHON: "3.11"
  FORK_TEST_BASE: ghcr.io/blakeblackshear/frigate:0.18.0-rc2

jobs:
  secrets_scan:
    name: Secrets - gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      # dev mirrors upstream, so dev..HEAD is exactly the fork's own commits.
      - run: git fetch --no-tags origin dev:refs/remotes/origin/dev
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan fork commits
        run: ./gitleaks git --no-banner --redact --log-opts="origin/dev..HEAD" .

  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: fork/scripts/ci-changes.sh

  web_lint:
    name: Web - Lint + typecheck
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/fork-web-setup
      # eslint (content strategy) and tsc (content hashes) both key their
      # caches on file contents, so a cache from an earlier commit is safe.
      - uses: actions/cache@v4
        with:
          path: web/.cache
          key: web-lint-cache-${{ github.sha }}
          restore-keys: web-lint-cache-
      - run: npm run lint
        working-directory: ./web
      - run: npm run typecheck
        working-directory: ./web
      - run: npm run i18n:extract:ci
        working-directory: ./web

  web_unit:
    name: Web - Unit tests + production build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/fork-web-setup
      - run: npx vitest run --coverage
        working-directory: ./web
      # Typechecking is web_lint's job; this is `npm run build` without tsc.
      - run: npx vite build --base=/BASE_PATH/
        working-directory: ./web
      - run: npm run bundle:budget
        working-directory: ./web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-coverage
          path: web/coverage
          retention-days: 7

  web_build:
    name: Web - E2E build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/fork-web-setup
      # `npm run e2e:build` without tsc; built once and shared by every shard.
      - run: npx vite build --base=/
        working-directory: ./web
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-dist
          path: web/dist
          retention-days: 1

  web_e2e:
    name: Web - E2E (${{ matrix.shard }}/3)
    needs: web_build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/fork-web-setup
      - uses: actions/download-artifact@v4
        with:
          name: e2e-dist
          path: web/dist
      # Headless runs use only the headless shell, a smaller download than the
      # full browser.
      - run: npx playwright install chromium --only-shell --with-deps
        working-directory: ./web
      - run: npm run e2e -- --shard=${{ matrix.shard }}/3
        working-directory: ./web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  python_checks:
    name: Python - Lint
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.4.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip
          cache-dependency-path: docker/main/requirements-dev.txt
      - run: |
          python3 -m pip install -U pip
          python3 -m pip install -r docker/main/requirements-dev.txt
      - run: ruff format --check --diff frigate migrations docker ./*.py
      - run: ruff check frigate migrations docker ./*.py

  python_tests:
    name: Python - mypy, API spec, unittest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: make version
      - run: docker build -f fork/Dockerfile.test --build-arg BASE="${FORK_TEST_BASE}" -t frigate-fork-test .
      - run: fork/scripts/py-checks.sh
        env:
          COVERAGE_XML: coverage-py/coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage
          path: coverage-py/coverage.xml
          retention-days: 7

  checks_passed:
    name: Checks passed
    if: always()
    needs:
      [secrets_scan, changes, web_lint, web_unit, web_build, web_e2e, python_checks, python_tests]
    runs-on: ubuntu-latest
    steps:
      # Skipped jobs are fine (their files did not change); failed or
      # cancelled ones are not.
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: ${RESULTS}"
          if [[ " ${RESULTS} " == *" failure "* || " ${RESULTS} " == *" cancelled "* ]]; then
            exit 1
          fi
