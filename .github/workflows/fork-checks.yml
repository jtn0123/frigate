name: Fork - Checks

# Same gates as upstream's pull_request.yml, run on every push to polish, with
# dependency caching and a thin backend test image instead of a full devcontainer
# build.

on:
  workflow_dispatch:
  push:
    branches:
      - polish
  pull_request:
    branches:
      - polish

env:
  DEFAULT_PYTHON: "3.11"
  FORK_TEST_BASE: ghcr.io/blakeblackshear/frigate:0.18.0-rc2

jobs:
  web_lint:
    name: Web - Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: ./web
      - run: npm run lint
        working-directory: ./web
      - run: npx tsc -p tsconfig.e2e.json
        working-directory: ./web
      - run: npm run i18n:extract:ci
        working-directory: ./web

  web_unit:
    name: Web - Unit tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: ./web
      - run: npx vitest run --coverage
        working-directory: ./web
      - run: npm run build
        working-directory: ./web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-coverage
          path: web/coverage
          retention-days: 7

  web_e2e:
    name: Web - E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: ./web
      - run: npx playwright install chromium --with-deps
        working-directory: ./web
      - run: npm run e2e:build
        working-directory: ./web
      - run: npm run e2e
        working-directory: ./web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  python_checks:
    name: Python - Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.4.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip
          cache-dependency-path: docker/main/requirements-dev.txt
      - run: |
          python3 -m pip install -U pip
          python3 -m pip install -r docker/main/requirements-dev.txt
      - run: ruff format --check --diff frigate migrations docker *.py
      - run: ruff check frigate migrations docker *.py

  python_tests:
    name: Python - Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: make version
      - run: docker build -f fork/Dockerfile.test --build-arg BASE=${FORK_TEST_BASE} -t frigate-fork-test .
      - name: mypy
        run: docker run --rm --entrypoint python3 frigate-fork-test -u -m mypy --config-file frigate/mypy.ini frigate
      - name: API spec is up to date
        run: docker run --rm --entrypoint python3 frigate-fork-test generate_api_auth_spec.py --check
      - name: unittest
        run: docker run --rm frigate-fork-test
