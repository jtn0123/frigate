name: Fork - Build image

# Builds an amd64 image and pushes it to ghcr.io/<owner>/frigate, plus a ROCm
# variant for AMD GPUs with the same tags and a -rocm suffix. main is the
# release branch (`make promote` moves it to next): every main build is tagged
# :main and :<upstream base>-<date>.<run>, and publishes a GitHub Release
# tagged fork/<that version> with notes from fork/scripts/release_notes.py. The
# running app finds its own release through the notes' build marker
# (frigate/fork/updates.py). A build of a commit that already has a release
# (a re-run) reuses its version and publishes no new release. A pushed fork/*
# tag builds an image of that tag only. Pulls layer cache from upstream's
# public build cache so a rebuild is usually well under the 40 minutes a cold
# build takes.

on:
  workflow_dispatch:
    inputs:
      rebuild_dependencies:
        description: Refresh dependency system packages without layer cache
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - "fork/*"
    # Files that never affect the image: a push touching only these keeps the
    # previous :main image, which is byte-for-byte what it would rebuild. The
    # next build's release notes still cover them.
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "!fork/**"
      - "fork/scripts/dependency_images.py"
      - "!web/e2e/**"
      - "!web/__test__/**"
      - "!.github/actions/fork-web-setup/**"
      - "!.github/workflows/fork-checks.yml"
      - "!.github/dependabot.yml"
      - "!.pre-commit-config.yaml"

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  amd64:
    runs-on: ubuntu-22.04
    name: AMD64 and ROCm fork build
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.tags.outputs.version }}
      released: ${{ steps.tags.outputs.released }}
      image: ${{ steps.tags.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch the upstream mirror
        run: git fetch --no-tags origin dev:refs/remotes/origin/dev
      - name: Set up QEMU and Buildx
        id: setup
        uses: ./.github/actions/setup
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          buildkit-config: |
            [worker.oci]
              max-parallelism = 2
      # The setup action gives nearly all free space to /var/lib/docker and
      # leaves the root disk about 1 GB; a long build's runner logs filled it
      # ("No space left on device"). The image jobs never use the tool cache.
      - name: Free root disk for runner logs
        run: |
          sudo rm -rf /opt/hostedtoolcache
          df -h / /var/lib/docker
      - name: Compute version and tags
        id: tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHORT_SHA="${GITHUB_SHA::7}"
          RELEASED=""
          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            # A re-run, or a dispatch of a commit main already released, finds
            # the release through its notes' build marker and keeps its version,
            # so the image tags match it and no second release is published.
            RELEASED="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.draft | not) | select((.body // \"\") | contains(\"fork-build: ${GITHUB_SHA} -->\")) | .tag_name")"
            RELEASED="${RELEASED%%$'\n'*}"
          fi
          if [[ "${RELEASED}" == fork/* ]]; then
            VERSION="${RELEASED#fork/}"
            echo "::notice::${GITHUB_SHA::9} is already released as ${RELEASED}; reusing its version"
          elif [[ "${GITHUB_REF}" == refs/tags/fork/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/fork/}"
          else
            # The upstream tag this build sits on, e.g. 0.18.0-20260911.42
            BASE_TAG="$(git describe --tags --match 'v*' --abbrev=0 "$(git merge-base HEAD origin/dev)")"
            VERSION="${BASE_TAG#v}-$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          fi
          TAGS="${IMAGE}:${SHORT_SHA}-amd64,${IMAGE}:${VERSION}"
          ROCM_TAGS="${IMAGE}:${SHORT_SHA}-rocm,${IMAGE}:${VERSION}-rocm"
          # Only main moves :main, the tag the server pulls.
          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            TAGS="${TAGS},${IMAGE}:main"
            ROCM_TAGS="${ROCM_TAGS},${IMAGE}:main-rocm"
          fi
          {
            echo "version=${VERSION}"
            echo "released=${RELEASED}"
            echo "image=${IMAGE}:${VERSION}"
            echo "tags=${TAGS}"
            echo "rocm-tags=${ROCM_TAGS}"
          } >> "$GITHUB_OUTPUT"
      - name: Build with versioned runtime dependencies
        env:
          CACHE: ${{ steps.setup.outputs.cache-name }}
          AMD64_TAGS: ${{ steps.tags.outputs.tags }}
          ROCM_TAGS: ${{ steps.tags.outputs.rocm-tags }}
          REBUILD_DEPENDENCIES: ${{ inputs.rebuild_dependencies }}
        run: |
          EXTRA=()
          if [[ "$REBUILD_DEPENDENCIES" == true ]]; then
            EXTRA+=(--rebuild-dependencies)
          fi
          python3 -u fork/scripts/dependency_images.py \
            --repository "ghcr.io/${GITHUB_REPOSITORY,,}" \
            --cache "$CACHE" --amd64-tags "$AMD64_TAGS" --rocm-tags "$ROCM_TAGS" \
            --output "$RUNNER_TEMP/image-build" "${EXTRA[@]}"
      - name: Preserve build logs and dependency digests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-build/
          if-no-files-found: ignore

  # Release readiness includes successful publication of both image variants.
  release:
    name: Publish release
    needs: amd64
    # Releases describe what the server pulls, so only main builds get one, and
    # only once per commit: a re-run would fail on the existing tag, or on a
    # later day publish a second latest release saying "No user-facing changes".
    if: github.ref == 'refs/heads/main' && needs.amd64.outputs.released == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch the upstream mirror
        run: git fetch --no-tags origin dev:refs/remotes/origin/dev
      - name: Write release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.amd64.outputs.image }}
        run: |
          PREVIOUS="$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 1 --json tagName --jq '.[0].tagName // empty')"
          python3 fork/scripts/release_notes.py --ref "$GITHUB_SHA" --upstream origin/dev \
            --image "$IMAGE" ${PREVIOUS:+--previous "$PREVIOUS"} > notes.md
          cat notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.amd64.outputs.version }}
        run: |
          # Creates fork/<version> at this commit. Tags created with
          # GITHUB_TOKEN do not trigger workflows, so this never rebuilds.
          gh release create "fork/${VERSION}" -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md --latest
