name: Fork - Build image

# Builds an amd64 image from the main branch (and any fork/* tag) and pushes it
# to ghcr.io/<owner>/frigate. Pulls layer cache from upstream's public build cache
# so a rebuild is usually well under the 40 minutes a cold build takes.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "fork/*"
    # Files that never reach the image: a push touching only these keeps the
    # previous :main image, which is byte-for-byte what it would rebuild.
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "fork/**"
      - "web/e2e/**"
      - "web/__test__/**"
      - ".github/actions/fork-web-setup/**"
      - ".github/workflows/fork-checks.yml"
      - ".github/dependabot.yml"
      - ".pre-commit-config.yaml"

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  amd64:
    runs-on: ubuntu-22.04
    name: AMD64 fork build
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up QEMU and Buildx
        id: setup
        uses: ./.github/actions/setup
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: tags
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHORT_SHA="${GITHUB_SHA::7}"
          TAGS="${IMAGE}:${SHORT_SHA}-amd64,${IMAGE}:main"
          if [[ "${GITHUB_REF}" == refs/tags/fork/* ]]; then
            TAGS="${TAGS},${IMAGE}:${GITHUB_REF#refs/tags/fork/}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
      - name: Build and push amd64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/main/Dockerfile
          push: true
          platforms: linux/amd64
          target: frigate
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: |
            type=registry,ref=${{ steps.setup.outputs.cache-name }}-amd64
            type=registry,ref=ghcr.io/blakeblackshear/frigate:cache-amd64
          cache-to: type=registry,ref=${{ steps.setup.outputs.cache-name }}-amd64,mode=max
