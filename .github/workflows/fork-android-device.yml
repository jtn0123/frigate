name: Fork - Android device tests

# Runs the Android viewer's on-device smoke tests (fork/android/app/src/androidTest:
# the Keystore token cipher, the encrypted settings store, the VPN permission check,
# and launching to sign-in) on an emulator (AN7). The JVM tests in "Fork - Android"
# cover the rest under Robolectric. An emulator run takes several minutes, so this
# runs only when started by hand, never on a push or pull request.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-android-device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device:
    name: Android device tests (API 34 emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: fork/android
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Hardware acceleration for the x86_64 emulator on the hosted runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the app and its device tests
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run the device tests on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: fork/android
          script: ./gradlew :app:connectedDebugAndroidTest
      - name: Test report
        if: always()
        uses: mikepenz/action-junit-report@8a133bfa3ecb0ea9024c1e2ae788b4c25f6cdb9d # v6.6.2
        with:
          report_paths: fork/android/app/build/outputs/androidTest-results/connected/**/TEST-*.xml
          annotate_only: true
          detailed_summary: true
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-reports
          path: |
            fork/android/app/build/reports/androidTests/
            fork/android/app/build/outputs/androidTest-results/
          retention-days: 7
