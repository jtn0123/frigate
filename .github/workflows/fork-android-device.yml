name: Fork - Android device tests

# Runs the Android viewer's on-device smoke tests (fork/android/app/src/androidTest:
# the Keystore token cipher, the encrypted settings store, the VPN permission check,
# and launching to sign-in) on an emulator (AN7), first on the debug build and then
# on the minified one, which R8 shrinks as it does the release build (AN20). The JVM
# tests in "Fork - Android" cover the rest under Robolectric. An emulator run takes
# several minutes, so a pull request runs it only when it changes what decides how
# R8 shrinks the app: the keep rules, the build file, the dependencies, the device
# tests or this workflow. Otherwise it is started by hand (Actions, Run workflow).

on:
  workflow_dispatch:
  pull_request:
    branches:
      - next
      - main
    paths:
      - "fork/android/app/proguard-*.pro"
      - "fork/android/app/build.gradle.kts"
      - "fork/android/gradle/libs.versions.toml"
      - "fork/android/app/src/androidTest/**"
      - ".github/workflows/fork-android-device.yml"

permissions:
  contents: read

concurrency:
  group: fork-android-device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device:
    name: Android device tests (API 34 emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: fork/android
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Hardware acceleration for the x86_64 emulator on the hosted runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Built before the emulator starts, so its wait is not spent compiling.
      # -Pfrigate.testBuildType picks the build the device tests run against.
      - name: Build the app and its device tests, debug and minified
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
          ./gradlew -Pfrigate.testBuildType=minified :app:assembleMinified :app:assembleMinifiedAndroidTest
      - name: Run the device tests on an emulator, debug then minified
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: fork/android
          script: |
            ./gradlew :app:connectedDebugAndroidTest
            ./gradlew -Pfrigate.testBuildType=minified :app:connectedMinifiedAndroidTest
      - name: Test report
        if: always()
        uses: mikepenz/action-junit-report@8a133bfa3ecb0ea9024c1e2ae788b4c25f6cdb9d # v6.6.2
        with:
          report_paths: fork/android/app/build/outputs/androidTest-results/connected/**/TEST-*.xml
          annotate_only: true
          detailed_summary: true
      # On failure, R8's mapping and what it removed too, to tell a missing keep
      # rule from a failing test: a minified stack trace reads back through
      # mapping.txt, and usage.txt lists the code R8 dropped.
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-device-reports
          path: |
            fork/android/app/build/reports/androidTests/
            fork/android/app/build/outputs/androidTest-results/
            fork/android/app/build/outputs/mapping/
          retention-days: 7
