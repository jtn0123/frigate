services:
  audio-trial:
    build: .
    image: local/frigate-audio-trial:20260912
    container_name: frigate-audio-trial
    restart: unless-stopped
    network_mode: host
    cpus: 3
    mem_limit: 7g
    memswap_limit: 7g
    pids_limit: 128
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 25s
    environment:
      CAMERAS: doorbell
      PARENT_MEMORY_LIMIT_BYTES: "21474836480" # Verified CT 106 limit (20 GiB); update if resized.
    volumes:
      - /opt/frigate/config/model_cache:/models:ro
      - ./state:/state
      - /opt/frigate/config/model_cache/audio-trial-telemetry:/telemetry
      - /sys/fs/cgroup:/host-cgroup:ro
    tmpfs:
      - /tmp:size=256m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    healthcheck:
      test: [CMD, python, -c, "import json,time; from pathlib import Path; assert time.time()-json.loads(Path('/state/status.json').read_text())['updated'] < 300"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
