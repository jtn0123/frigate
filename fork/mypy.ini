# Type checking for the fork's own Python: the host monitoring collectors, the
# audio companion trial and the CI scripts. Same strict flags as
# frigate/mypy.ini, with no ignore sections: these files are new, so they start
# strict and stay strict (I16 in fork/GRADE-REPORT.md).
#
#   python3 -m mypy --config-file fork/mypy.ini fork/monitoring fork/audio_trial fork/scripts
#
# Tests are excluded for the same reason frigate/mypy.ini ignores frigate.test:
# annotating assertions and mock plumbing costs more than it catches.
[mypy]
python_version = 3.11
show_error_codes = true
follow_imports = normal
ignore_missing_imports = true
strict_equality = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
enable_error_code = ignore-without-code
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
# https://github.com/python/mypy/issues/10757
disallow_untyped_calls = false
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unreachable = true
no_implicit_reexport = true
exclude = (?x)(/test_[^/]+\.py$)

# The tools are flat directories run by path (fork/audio_trial, fork/monitoring),
# so their modules are top level to each other.
mypy_path = fork/audio_trial:fork/audio_trial/benchmarks:fork/monitoring:fork/scripts
