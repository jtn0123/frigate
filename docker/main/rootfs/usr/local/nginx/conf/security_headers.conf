## Browser security headers.
##
## nginx's add_header is not inherited by a location that declares its own
## add_header, so this file is included at server level and again in every
## location (directly or via auth_request.conf) that adds headers of its own.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# two-way talk needs the microphone; nothing needs the camera or location
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

# HSTS is only meaningful on TLS. $hsts_value is empty for plain HTTP
# requests (see the map in nginx.conf) and nginx drops empty headers.
add_header Strict-Transport-Security $hsts_value always;

# CSP describing what the UI actually uses: inline scripts and blob workers
# (monaco, players), blob media, data: images and fonts, and websocket
# connections to this origin. Enforcing since E6; the e2e suite loads the built
# app behind this exact policy (web/e2e/specs/fork/csp.spec.ts reads it from
# this file) and fails on any violation, so a new external dependency is caught
# before it ships rather than only appearing in a browser console.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' ws: wss: blob: data:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
