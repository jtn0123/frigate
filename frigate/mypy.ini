[mypy]
python_version = 3.11
show_error_codes = true
follow_imports = normal
ignore_missing_imports = true
strict_equality = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
enable_error_code = ignore-without-code
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
# https://github.com/python/mypy/issues/10757
disallow_untyped_calls = false
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unreachable = true
no_implicit_reexport = true

[mypy-frigate.*]
ignore_errors = false

# Third-party code imported from https://github.com/ufal/whisper_streaming
[mypy-frigate.data_processing.real_time.whisper_online]
ignore_errors = true

# TODO: Remove ignores for these modules as they are updated with type annotations.

[mypy-frigate.api.*]
ignore_errors = true

[mypy-frigate.config.*]
ignore_errors = true

[mypy-frigate.detectors.*]
ignore_errors = true

[mypy-frigate.embeddings.*]
ignore_errors = true

[mypy-frigate.ptz.*]
ignore_errors = true

[mypy-frigate.test.*]
ignore_errors = true

[mypy-frigate.util.*]
ignore_errors = true

[mypy-frigate.video.*]
ignore_errors = true

# Modules inside the ignored packages that are already clean under the strict
# flags (I3 in fork/GRADE-REPORT.md). Checking them costs nothing today and
# stops them regressing while the rest of each package is worked through. A
# module leaves this list only by being fixed, never by being re-ignored.
#
# frigate.util.media is not here: its `Recordings.id.in_(...)` reads as a call
# to an instance variable under the image's types-peewee stubs ("Too few
# arguments"), which needs a peewee typing fix rather than an ignore.
[mypy-frigate.config.camera.audio]
ignore_errors = false

